<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 恐怖故事视觉生成器</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --panel-2: #1b1f26;
    --border: #2a2f38;
    --text: #d7dbe0;
    --muted: #8b93a0;
    --accent: #b3131c;
    --accent-2: #7fb0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 26px; letter-spacing: 2px; margin: 0 0 4px; }
  h1 .accent { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  .composer { background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; }
  textarea {
    width: 100%; min-height: 140px; resize: vertical; background: var(--panel-2);
    color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-size: 15px; font-family: inherit; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: var(--accent-2); }

  /* 设置区:分组网格布局,更整齐 */
  .settings {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .field {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .field .label {
    display: block; color: var(--muted); font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .field select {
    width: 100%; background: transparent; color: var(--text); border: none;
    font-size: 14px; padding: 2px 0; outline: none; cursor: pointer;
    font-family: inherit;
  }
  .field select option { background: var(--panel-2); color: var(--text); }

  .actions { display: flex; gap: 12px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }

  details.art { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; background: var(--panel-2); }
  details.art[open] { padding-bottom: 14px; }
  details.art summary { cursor: pointer; color: var(--accent-2); font-size: 13px;
    padding: 4px 0; user-select: none; }
  details.art textarea { min-height: 60px; margin-top: 6px; }
  .alabel { display: block; color: var(--muted); font-size: 12px; margin-top: 10px; }

  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 11px 26px; font-size: 15px; cursor: pointer; letter-spacing: 1px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.stop { background: #3a3f47; }
  button.stop:hover { background: #4a505a; }

  .videobox { display: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-top: 18px; }
  .videobox video { width: 100%; max-width: 720px; border-radius: 8px; display: block;
    margin: 0 auto; background: #000; }
  .videobox.portrait video { max-width: 360px; }

  .status { margin: 24px 0 8px; display: none; }
  .stages { display: flex; gap: 8px; flex-wrap: wrap; }
  .stage {
    flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted);
  }
  .stage.active { border-color: var(--accent-2); color: var(--text); }
  .stage.active .dot { background: var(--accent-2); animation: pulse 1s infinite; }
  .stage.done { color: var(--text); }
  .stage.done .dot { background: #3fae6a; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); margin-right: 8px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .story { display: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-top: 18px; }
  .story h2 { margin: 0 0 4px; font-size: 20px; }
  .story .logline { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .bible { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .bible b { display: inline-block; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 10px; font-weight: normal; font-size: 12px; color: var(--accent-2); }

  .section-title { margin: 18px 0 10px; font-size: 14px; letter-spacing: 2px;
    color: var(--accent-2); border-left: 3px solid var(--accent); padding-left: 10px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
    gap: 12px; margin-top: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; aspect-ratio: 16/9; position: relative; }
  .card.portrait { aspect-ratio: 9/16; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .idx { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6);
    color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 12px; }
  .card.placeholder { display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; border-style: dashed; }
  .card.placeholder.busy { animation: pulse 1.4s infinite; }

  .err { display: none; background: #2a1414; border: 1px solid var(--accent);
    color: #f0b8b8; border-radius: 8px; padding: 12px 14px; margin-top: 18px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI <span class="accent">恐怖故事</span> 视觉生成器</h1>
  <div class="sub">粘贴故事稿或播音稿 → 结构化分镜 · 关键帧 · 配音字幕成片</div>

  <div class="composer">
    <textarea id="script" placeholder="在这里粘贴完整故事稿 / 播音稿(逐行或整段皆可,中英文自动识别)…&#10;例:&#10;那是1990年的夏天,贵州偏远山村的一间土坯屋里…"></textarea>

    <div class="settings">
      <div class="field">
        <label class="label">语言</label>
        <select id="language">
          <option value="zh" selected>中文</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="field">
        <label class="label">画幅</label>
        <select id="orientation">
          <option value="landscape" selected>横向 · YouTube 长视频 (16:9)</option>
          <option value="portrait">竖向 · YouTube Shorts (9:16)</option>
        </select>
      </div>
      <div class="field">
        <label class="label">风格</label>
        <select id="style">
          <option value="horror" selected>恐怖(默认)</option>
          <option value="realistic">写实 / 纪实</option>
          <option value="none">无(纯描述)</option>
        </select>
      </div>
      <div class="field">
        <label class="label">分镜图数量</label>
        <select id="frames">
          <option selected>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option>
          <option>9</option><option>10</option><option>11</option><option>12</option>
          <option>13</option><option>14</option><option>15</option><option>16</option>
          <option>17</option><option>18</option><option>19</option><option>20</option>
          <option>21</option><option>22</option><option>23</option><option>24</option>
          <option>25</option>
        </select>
      </div>
      <div class="field">
        <label class="label">语速</label>
        <select id="speed">
          <option value="fast" selected>快速(默认)</option>
          <option value="slow">适中 · 长视频</option>
        </select>
      </div>
    </div>

    <details class="art">
      <summary>🎨 美术设定(约束年代 / 服饰 / 环境 / 道具)</summary>
      <label class="alabel">要什么(正向)</label>
      <textarea id="artpos" rows="2" placeholder="例如:1990年代贵州偏远山村,土坯木屋,泥路,油灯,村民穿洗旧的深蓝灰色粗布衣布鞋"></textarea>
      <label class="alabel">不要什么(负向)</label>
      <textarea id="artneg" rows="2" placeholder="例如:现代汽车, 智能手机, 现代服装, 霓虹灯, 高楼, 塑料制品, 西式建筑"></textarea>
      <div class="hint">中/英文均可(含中文会自动翻译成英文再用于生成)。留空则用 config.yaml 的默认值。</div>
    </details>

    <div class="actions">
      <button id="go">生成</button>
      <button id="stop" class="stop" style="display:none">■ 停止</button>
      <span class="hint" style="margin: 0">建议:先用 5–10 张验证风格,再上 25/30 张。</span>
    </div>
  </div>

  <div class="status" id="status">
    <div class="stages" id="stages"></div>
  </div>

  <div class="err" id="err"></div>

  <div class="story" id="story">
    <h2 id="s-title"></h2>
    <div class="logline" id="s-logline"></div>
    <div class="bible" id="s-bible"></div>
  </div>

  <div class="videobox" id="videobox">
    <div class="section-title">成片(配音 + 字幕)</div>
    <video id="player" controls playsinline></video>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let timer = null;
let currentJob = null;
let expectedFrames = 25;
let currentOrientation = "landscape";

$("go").addEventListener("click", start);
$("stop").addEventListener("click", stop);

function setRunning(running) {
  $("go").disabled = running;
  $("stop").style.display = running ? "inline-block" : "none";
}

async function stop() {
  if (!currentJob) return;
  $("stop").disabled = true;
  $("stop").textContent = "停止中…";
  try {
    await fetch("/api/jobs/" + currentJob + "/cancel", { method: "POST" });
  } catch (e) { /* poll loop will reflect the final state */ }
}

async function start() {
  const script = $("script").value.trim();
  if (!script) { $("script").focus(); return; }
  const frames = parseInt($("frames").value, 10) || 25;
  const orientation = $("orientation").value;
  const language = $("language").value;
  expectedFrames = frames;
  currentOrientation = orientation;

  $("err").style.display = "none";
  $("story").style.display = "none";
  $("videobox").style.display = "none";
  $("videobox").classList.toggle("portrait", orientation === "portrait");
  $("player").removeAttribute("src");
  $("grid").innerHTML = "";
  $("status").style.display = "block";
  $("stop").disabled = false;
  $("stop").textContent = "■ 停止";
  setRunning(true);
  stageNames = [];
  renderStages({ step: 1, total: 4, label: "配音(逐句)" });

  let job_id;
  try {
    const r = await fetch("/api/generate", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        script,
        num_frames: frames,
        art_positive: $("artpos").value,
        art_negative: $("artneg").value,
        style: $("style").value,
        orientation, language,
        speed: $("speed").value,
      }),
    });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      const d = body.detail;
      const msg = Array.isArray(d) ? d.map(e => `${(e.loc||[]).join('.')}: ${e.msg}`).join("; ")
                : (typeof d === "string" ? d : r.statusText);
      throw new Error(msg);
    }
    job_id = (await r.json()).job_id;
  } catch (e) {
    showError("启动失败:" + e.message);
    setRunning(false);
    return;
  }
  currentJob = job_id;
  timer = setInterval(() => poll(job_id), 1500);
  poll(job_id);
}

async function poll(job_id) {
  let job;
  try {
    const r = await fetch("/api/jobs/" + job_id);
    job = await r.json();
  } catch (e) { return; }

  if (job.stage) renderStages(job.stage);
  if (job.story) renderStory(job.story);
  if (job.video) {
    $("videobox").style.display = "block";
    if ($("player").getAttribute("src") !== job.video) $("player").src = job.video;
  }
  renderGrid(job);

  if (job.status === "done" || job.status === "error" || job.status === "cancelled") {
    clearInterval(timer);
    setRunning(false);
    currentJob = null;
    if (job.status === "done") markStagesComplete();
    if (job.status === "error") showError("生成中断:" + (job.error || "未知错误"));
    if (job.status === "cancelled") {
      const n = (job.images || []).length;
      showError("已停止生成" + (n ? `(已保留 ${n} 张已完成的图片)` : "") + "。");
    }
  }
}

let stageNames = [];
function renderStages(stage) {
  const step = stage.step || 1;
  const total = stage.total || Math.max(stageNames.length, step);
  if (stageNames.length !== total) stageNames = new Array(total).fill("");
  if (stage.label) stageNames[step - 1] = stage.label;
  $("stages").innerHTML = stageNames.map((name, i) => {
    const n = i + 1;
    const cls = n < step ? "done" : (n === step ? "active" : "");
    return `<div class="stage ${cls}"><span class="dot"></span>${n}. ${name || ("步骤" + n)}</div>`;
  }).join("");
}
function markStagesComplete() {
  document.querySelectorAll(".stage").forEach(el => {
    el.classList.remove("active"); el.classList.add("done");
  });
}

function renderStory(s) {
  $("story").style.display = "block";
  $("s-title").textContent = s.title || "";
  $("s-logline").textContent = s.logline || "";
  const b = s.style_bible || {};
  $("s-bible").innerHTML = Object.values(b).map(v => `<b>${esc(v)}</b>`).join("");
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function renderGrid(job) {
  const total = expectedFrames;
  const byId = {};
  (job.images || []).forEach(im => { byId[im.scene_id] = im; });
  const busyIndex = (job.stage && job.stage.step === 3) ? (job.images || []).length + 1 : -1;
  const cardCls = currentOrientation === "portrait" ? "card portrait" : "card";

  let html = "";
  for (let i = 1; i <= total; i++) {
    const im = byId[i];
    if (im) {
      html += `<div class="${cardCls}"><span class="idx">#${i}</span>
                 <img src="${im.url}" alt="frame ${i}" /></div>`;
    } else {
      const busy = (i === busyIndex) ? "busy" : "";
      const label = busy ? "渲染中…" : "#" + i;
      html += `<div class="${cardCls} placeholder ${busy}">${label}</div>`;
    }
  }
  if ((job.images && job.images.length) || (job.stage && job.stage.step === 3)) {
    $("grid").innerHTML = html;
  }
}

function showError(msg) { $("err").textContent = msg; $("err").style.display = "block"; }
</script>
</body>
</html>
