# AI Horror Story Visual Generator — configuration
# ---------------------------------------------------------------------------
# All runtime knobs live here so the pipeline is reproducible run-to-run.

deepseek:
  # DeepSeek uses an OpenAI-compatible API.
  # The API key is read from the DEEPSEEK_API_KEY environment variable.
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 0.8          # story creation wants some creativity
  analysis_temperature: 0.4 # scene / prompt work wants determinism

comfyui:
  # Address of your running ComfyUI instance.
  host: "127.0.0.1"
  port: 8188
  workflow: "workflows/sdxl_horror.json"
  # Node IDs inside the workflow JSON that the client patches per image.
  nodes:
    positive_prompt: "6"    # CLIP Text Encode (positive)
    negative_prompt: "7"    # CLIP Text Encode (negative)
    ksampler: "3"           # KSampler (seed lives here)
    latent: "5"             # EmptyLatentImage (width / height)
    save_image: "9"         # SaveImage (filename prefix)
  # IPAdapter variant: base workflow + reference-image conditioning for
  # character consistency. Shares the node ids above; adds the two below.
  workflow_ipadapter: "workflows/sdxl_ipadapter.json"
  nodes_ipadapter:
    load_image: "10"        # LoadImage (character reference)
    ipadapter: "12"         # IPAdapterAdvanced (weight lives here)
  ipadapter_weight: 0.75    # 0.5 loose .. 1.0 strong face lock
  timeout_seconds: 300

generation:
  num_key_frames: 10        # V1: 10 key frames is enough for a 10-min video
  width: 1024
  height: 1024
  steps: 30
  cfg: 6.5
  sampler_name: "dpmpp_2m"
  scheduler: "karras"
  # A fixed base seed makes runs reproducible; each frame adds its index.
  base_seed: 20260721

negative_prompt: >-
  lowres, bad anatomy, bad hands, text, error, missing fingers,
  extra digit, fewer digits, cropped, worst quality, low quality,
  jpeg artifacts, signature, watermark, username, blurry, cartoon,
  anime, illustration, deformed, disfigured

output_dir: "outputs"

video:
  # "Living stills" motion video (Ken Burns) — no GPU, runs on any Mac.
  fps: 30
  size: 1024
  clip_seconds: 4.0        # per-image duration (narrated mode overrides by voice length)
  crossfade_seconds: 0.6   # crossfade between clips
  mood_overlay: true       # vignette + film grain for horror atmosphere
  tts:
    # Narrator voice. engine "edge" = Microsoft neural voices (natural, free,
    # needs internet); falls back to macOS `say` offline.
    engine: "edge"
    voice: "zh-CN-YunjianNeural"   # 云健:小说/旁白男声。其他:YunxiNeural / YunyangNeural(新闻) / XiaoxiaoNeural(女声)
    rate: "-8%"                    # 慢一点更阴森
    pitch: "-2Hz"
    say_voice: "Tingting"          # offline fallback

logging:
  # Console level (the file always logs at DEBUG). Override with LOG_LEVEL env.
  level: "INFO"           # DEBUG | INFO | WARNING | ERROR
  file: "app.log"         # written under logs/
  max_bytes: 5000000      # rotate at ~5 MB
  backup_count: 3         # keep app.log.1 .. app.log.3
